[package]
name = "inkarchy"
version = "0.3.0"
edition = "2021"
rust-version = "1.89"
authors = ["CloudDown"]
description = "Inkarchy — stylus notes on an Omarchy lectern"
license = "MIT"
default-run = "inkarchy"

[[bin]]
name = "inkarchy"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
egui = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
directories = "6"
rfd = "0.15"
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
tiny-skia = "0.11"
fontdue = "0.9"
flate2 = "1"
arboard = "3"
raw-window-handle = "0.6"
hayro = "0.5"
lopdf = "0.36"
resvg = "0.45"
usvg = "0.45"
kurbo = "0.12"

# One codegen unit and thin LTO make the release smaller and faster.
# Symbols are stripped. Panics still unwind so a file-dialog failure can be caught.
[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
wayland-backend = { version = "0.3.17", features = ["client_system", "dlopen"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
