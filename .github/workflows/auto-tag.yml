name: Auto tag

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Cargo.toml version
        id: ver
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          if [ -z "$version" ]; then
            echo "Could not read version from Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml version is $version"

      - name: Create tag when missing
        id: check
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          TAG="v${VERSION}"
          git fetch --tags --force
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists; nothing to do."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -qE "^## ${VERSION}( |$)" CHANGELOG.md; then
            echo "CHANGELOG.md needs a '## ${VERSION}' section before tagging." >&2
            exit 1
          fi
          git tag "$TAG"
          git push origin "refs/tags/${TAG}"
          echo "Created and pushed ${TAG}."
          echo "should_release=true" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    if: needs.tag.outputs.should_release == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: v${{ needs.tag.outputs.version }}
    secrets: inherit
